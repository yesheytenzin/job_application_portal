# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "job_application_portal_development" ) %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME" , "job_application_portal_test" ) %>

production:
  primary: &primary_production
    <<: *default
    database: job_application_portal_production
    username: job_application_portal
    password: <%= ENV["JOB_APPLICATION_PORTAL_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: job_application_portal_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: job_application_portal_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: job_application_portal_production_cable
    migrations_paths: db/cable_migrate
